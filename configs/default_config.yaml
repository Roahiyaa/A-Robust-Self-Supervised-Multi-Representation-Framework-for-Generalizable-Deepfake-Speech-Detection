system:
  seed: 42
  device: "cpu"  # Auto-detected as CPU or CUDA
  num_workers: 0

audio:
  sample_rate: 16000
  duration_sec: 4.0
  max_samples: 64000
  chunk_len_sec: 1.0
  overlap_sec: 0.5
  vad_enabled: true

features:
  ssl:
    enabled: true
    model_name: "microsoft/wavlm-base-plus"
    finetune_strategy: "frozen" # options: frozen, partial, full
    unfreeze_top_k: 4
    output_dim: 768

  spectral:
    enabled: true
    type: "lfcc" # options: lfcc, logmel, cqt
    num_cepstral: 20
    include_deltas: true
    n_mels: 80
    output_dim: 256

  acoustic:
    enabled: true
    include_validity_masks: true
    output_dim: 128

fusion:
  embed_dim: 256
  gated_enabled: true
  cross_attention_enabled: true
  bidirectional: true
  temporal_transformer:
    enabled: true
    num_layers: 2
    nhead: 4

heads:
  binary:
    enabled: true
  attack:
    enabled: false # Enabled dynamically if attack labels exist
    num_classes: 10
  segment:
    enabled: false # Enabled strictly if frame annotations exist

training:
  batch_size: 4
  epochs: 10
  lr: 0.0001
  weight_decay: 0.0001
  loss_weights:
    lambda_binary: 1.0
    lambda_attack: 0.5
    lambda_segment: 0.5
    lambda_supcon: 0.1
  use_supcon: false

calibration:
  temperature_scaling: true

ood_uncertainty:
  mc_dropout_passes: 10
  energy_temperature: 1.0
